# resources/jobs/generic_api_ingestion.job.yml 
 
resources: 
  jobs: 
    generic_api_ingestion_job: 
      name: generic_api_ingestion_job 
 
      max_concurrent_runs: 1 
 
      queue: 
        enabled: true 
 
      # ============================================================ 
      # JOB CLUSTER OPTION â€” FUTURE USE 
      # ============================================================ 
      # 
      # The current job uses serverless compute. 
      # 
      # To use a classic job cluster in the future: 
      # 
      # 1. Uncomment the job_clusters block below. 
      # 2. Uncomment job_cluster_key under the ingest_api task. 
      # 3. Remove/comment the environment_key from ingest_api. 
      # 4. Adjust the Spark/runtime/node specifications. 
      # 
      # job_clusters: 
      #   - job_cluster_key: ingestion_job_cluster 
      # 
      #     new_cluster: 
      #       spark_version: "YOUR_DATABRICKS_RUNTIME" 
      #       node_type_id: "YOUR_NODE_TYPE" 
      #       driver_node_type_id: "YOUR_DRIVER_NODE_TYPE" 
      # 
      #       num_workers: 2 
      # 
      #       # Optional autoscaling instead of num_workers: 
      #       # 
      #       # autoscale: 
      #       #   min_workers: 1 
      #       #   max_workers: 4 
      # 
      #       # Optional Spark configuration: 
      #       # 
      #       # spark_conf: 
      #       #   spark.sql.adaptive.enabled: "true" 
      # 
      #       # Optional environment variables: 
      #       # 
      #       # spark_env_vars: 
      #       #   ENVIRONMENT: "${var.environment}" 
      # 
      # ============================================================ 
 
      # ============================================================ 
      # SCHEDULE OPTIONS 
      # ============================================================ 
      # 
      # ACTIVE: every 5 minutes 
      schedule: 
        quartz_cron_expression: "0 0/5 * * * ?" 
        timezone_id: "UTC" 
        pause_status: PAUSED 
 
      # ------------------------------------------------------------ 
      # CONTINUOUS 
      # Uncomment this block and remove the schedule block above 
      # when continuous execution is required. 
      # 
      # continuous: 
      #   pause_status: UNPAUSED 
      # 
      # ------------------------------------------------------------ 
      # 30 MINUTES 
      # 
      # schedule: 
      #   quartz_cron_expression: "0 0/30 * * * ?" 
      #   timezone_id: "UTC" 
      #   pause_status: UNPAUSED 
      # 
      # ------------------------------------------------------------ 
      # HOURLY 
      # 
      # schedule: 
      #   quartz_cron_expression: "0 0 * * * ?" 
      #   timezone_id: "UTC" 
      #   pause_status: UNPAUSED 
      # 
      # ------------------------------------------------------------ 
      # DAILY 
      # Runs every day at 00:00 UTC. 
      # 
      # schedule: 
      #   quartz_cron_expression: "0 0 0 * * ?" 
      #   timezone_id: "UTC" 
      #   pause_status: UNPAUSED 
      # 
      # ------------------------------------------------------------ 
      # WEEKLY 
      # Runs every Monday at 00:00 UTC. 
      # 
      # schedule: 
      #   quartz_cron_expression: "0 0 0 ? * MON" 
      #   timezone_id: "UTC" 
      #   pause_status: UNPAUSED 
      # 
      # ------------------------------------------------------------ 
      # MONTHLY 
      # Runs on the first day of every month at 00:00 UTC. 
      # 
      # schedule: 
      #   quartz_cron_expression: "0 0 0 1 * ?" 
      #   timezone_id: "UTC" 
      #   pause_status: UNPAUSED 
      # 
      # ------------------------------------------------------------ 
      # YEARLY 
      # Runs on January 1 at 00:00 UTC. 
      # 
      # schedule: 
      #   quartz_cron_expression: "0 0 0 1 1 ?" 
      #   timezone_id: "UTC" 
      #   pause_status: UNPAUSED 
 
      email_notifications: 
        on_success: 
          - karan_vsk@hotmail.com 
        on_failure: 
          - karan_vsk@hotmail.com 
 
      environments: 
        - environment_key: ingestion_serverless 
          spec: 
            environment_version: "3" 
            dependencies: 
              - ../../dist/*.whl 
 
      parameters: 
        - name: api_name 
          default: ALL 
 
        - name: landing_catalog 
          default: ${var.landing_catalog} 
 
        - name: landing_schema 
          default: ${var.landing_schema} 
 
        - name: landing_volume 
          default: ${var.landing_volume} 
 
      tasks: 
        - task_key: ingest_api 
 
          environment_key: ingestion_serverless 
 
          python_wheel_task: 
            package_name: enterprise_api_ingestion_platform 
            entry_point: main 
 
            named_parameters: 
              api_name: "{{job.parameters.api_name}}" 
              landing_catalog: "{{job.parameters.landing_catalog}}" 
              landing_schema: "{{job.parameters.landing_schema}}" 
              landing_volume: "{{job.parameters.landing_volume}}" 
 
        - task_key: bronze_pipeline 
 
          depends_on: 
            - task_key: ingest_api 
 
          pipeline_task: 
            pipeline_id: 5765b743-e6b6-45fd-8bf3-c868b14edc7f 
 
        - task_key: silver_pipeline 
 
          depends_on: 
            - task_key: bronze_pipeline 
 
          pipeline_task: 
            pipeline_id: f304ec82-b953-42ce-b727-564960c459ea

        - task_key: gold_pipeline

          depends_on:
            - task_key: silver_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}